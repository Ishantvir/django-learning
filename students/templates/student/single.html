{% extends "base.html" %}
{% block start%}

<h1 class="text-center"> Student Data </h1>

{% if student %}
<h2 class="text-center"> Student List: </h2>
<div class="container d-flex justify-content-center mb-3">
    <button type="button" class="btn btn-primary"><a href="{% url 'all_data' %}" class="nav-link" style="color: white; text-decoration: none;">View All Students</a></button>
</div>
<div class="container">
    <table class="table table-dark table-striped-columns">
        <thead>
            <tr>
                <th scope="col" class="text-center">ID</th>
                <th scope="col">Name</th>
                <th scope="col">Email</th>
                <th scope="col">Course</th>
                <th scope="col">City</th>
                <th scope="col" class="text-center">Marks</th>
                <th scope="col" class="text-center">Edit/Delete</th>
            </tr>
        </thead>
        <tbody>
            {% for s in student%}
            <tr>
                <th scope="row" class="text-center">{{s.id}}</th>
                <td>{{s.name}}</td>
                <td>{{s.email}}</td>
                <td>{{s.course}}</td>
                <td>{{s.city}}</td>
                <td class="text-center">{{s.marks}}</td>
                <td>
                    <div class="container text-center">
                        <button type="button" class="btn btn-success"><a href="{% url 'update_student' s.id %}" class="nav-link">Edit</a>
                        </button>
                        <button type="button" class="btn btn-danger">Delete</button>
                    </div>
                </td>
            </tr>
            {% endfor %}

        </tbody>
    </table>
</div>
{% else %}
<h2> No Data </h2>
{% endif %}

{% endblock start%}
