{% extends "base.html" %}

{% block start %}
<div class='container mt-2'>
    <form class = 'col-6 mx-auto card p-3 shadow-lg' method = 'post' >
    {% csrf_token %}
    <h2 class='text-center'> Registration </h2>
    <hr>
    {% if messages %}
    {% for message in messages %}
        <div class="alert alert-info" role="alert">
            {{ message }}
        </div>
    {% endfor %}
    {% endif %}
    <div class="form-group">
        <label for="first_name" class='mb-2'>First Name</label>
        <input type="text" class="form-control" id="first_name" name='first_name' placeholder='Enter Your First Name'>
    </div>
    <div class="form-group">
        <label for="last_name" class='mb-2 mt-3'>Last Name</label>
        <input type="text" class="form-control" id="last_name" name='last_name' placeholder='Enter Your Last Name'>
    </div>
    <div class="form-group">
        <label for="username" class='mb-2 mt-3'>Username</label>
        <input type="text" class="form-control" id="username" name='username' placeholder='Enter Your Username'>
    </div>
    <div class="form-group">
        <label for="pwd" class='mb-2 mt-3'>Password</label>
        <input type="password" class="form-control" id="pwd" name='password' placeholder='Enter Your Password'>
    </div>
    <p class='mt-2'> Already have an account? <a href='{% url "login_page" %}' class='text-primary'>Login</a><p>
    <button type="submit" class="btn btn-primary">Submit</button>
    </form>
</div>


{% endblock start %}
